<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1b1e3c" />
  <title>SnapWorld</title>
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="labels"></div>
  <div id="me-bubble" class="hidden"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="#fff"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="#fff"/></svg></div>
  <div id="me-tag" class="hidden">Me <span>now</span></div>

  <div id="hud">
    <div id="chips" role="toolbar" aria-label="Filter places"></div>
    <div id="status" class="chip hidden"></div>
    <div id="hint" class="chip hint hidden"></div>
    <div id="stick" class="stick hidden"><div class="knob"></div></div>
    <button id="btn-jump" class="round jump hidden" aria-label="Jump">
      <svg viewBox="0 0 24 24"><path d="M12 4l-6 7h4v6h4v-6h4z" fill="currentColor"/><path d="M6 20h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="side">
      <button id="btn-compass" class="round" title="Point north" aria-label="Point north">
        <svg viewBox="0 0 40 40" id="compass-needle"><path d="M20 6 L25 20 L15 20 Z" fill="#ff5a5f"/><path d="M20 34 L25 20 L15 20 Z" fill="#e7e9ff"/><text x="20" y="5" text-anchor="middle" font-size="0">N</text></svg>
      </button>
      <button id="btn-search" class="round" title="Search a place" aria-label="Search a place">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 L21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-walk" class="round" title="Walk mode" aria-label="Walk mode">
        <svg viewBox="0 0 24 24" id="walk-icon"><circle cx="13" cy="4" r="2" fill="currentColor"/><path d="M10 21l2-6 3 3v3M8 12l2-4h4l3 4M12 8l-2 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-recenter" class="round hidden" title="Back to me" aria-label="Back to me">
        <svg viewBox="0 0 24 24"><path d="M3 11 L21 3 L13 21 L11 13 Z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <div id="gate" class="gate">
    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 48 48"><path d="M24 4c-8 0-14 6-14 14 0 10 14 26 14 26s14-16 14-26c0-8-6-14-14-14z" fill="#2aa7ff"/><circle cx="24" cy="18" r="5.5" fill="#fff"/></svg>
      </div>
      <h1 id="gate-title">Explore the world around you</h1>
      <p id="gate-text">SnapWorld builds a 3D map of the streets, buildings and places around your live location.</p>
      <button id="gate-primary" class="primary">Use my location</button>
      <form id="search-form" class="search hidden" autocomplete="off">
        <input id="search-input" type="search" placeholder="Search a place or address" aria-label="Search a place" />
        <ul id="search-results"></ul>
      </form>
      <button id="gate-secondary" class="link hidden">Search a place instead</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
